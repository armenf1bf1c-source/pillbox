<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7eeea">
<meta name="apple-mobile-web-app-title" content="Lolid Pillbox">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<title>Lolid Pillbox App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Onest:wght@400;600;700;800;900&family=Noto+Serif:ital,wght@1,700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Lolid Pillbox: розоватая бумага, чёрная типографика, красный акцент. Всё нажимаемое — со скруглением. */
:root{
  --sheet:#f7eeea;
  --card:#fffaf8;
  --ink:#201e1d;
  --muted:#76625d;
  --line:rgba(32,30,29,.14);
  --red:#dd2b0f;
  --red-deep:#ae1800;
  --red-press:#861200;
  --red-tint:#f6d8d0;
  --bt:#0082fc;
  --desk:#e8e1de;
  --frame:#1d1b1a;
  --sys-surface:#f4f1ef;
  --r:14px;
  --rs:10px;
  --rx:6px;
  --font:"Archivo","Onest","Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:"Noto Serif","Times New Roman",Times,serif;
  --sys:"Roboto","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:14px/1.4 var(--font)}
button,input,textarea{font:inherit;color:inherit}
h2,p{margin:0}
:focus-visible{outline:3px solid var(--bt);outline-offset:2px}

/* ------------------------------ стол ------------------------------ */
.wrap{display:flex;gap:44px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding-block:28px 48px;padding-inline:16px}
.holder{width:380px;flex:none;overflow:hidden}
.phone{width:380px;height:800px;background:var(--frame);border-radius:46px;padding:10px;box-shadow:0 30px 70px rgba(32,30,29,.22);transform-origin:top left}
.screen{position:relative;width:360px;height:780px;border-radius:36px;overflow:hidden;background:var(--sheet)}

/* на телефоне — приложение во весь экран, без рамки и без панели */
body.phone{background:var(--sheet)}
body.phone .wrap{display:block;padding:0}
body.phone .holder{width:auto!important;height:auto!important;overflow:visible}
body.phone .phone{width:auto;height:auto;background:none;border-radius:0;padding:0;box-shadow:none;transform:none!important}
body.phone .screen{position:fixed;inset:0;width:auto;height:auto;border-radius:0}
body.phone .panel{display:none}
body.phone .view{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
body.phone .view.notabs{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 36px)}
body.phone .tabs{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
body.phone .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
body.phone .alarm{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
body.phone .sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
body.phone .hu{top:calc(env(safe-area-inset-top,0px) + 6px)}

/* системная строка Android (только в демо на компьютере) */
.sbar{position:absolute;top:0;left:0;right:0;height:30px;z-index:40;display:flex;align-items:center;gap:6px;padding:0 24px;font:500 13px var(--sys);color:var(--ink);cursor:pointer}
.sbar.inv{color:#fff}
.sbar .sp{flex:1}
.gbar{position:absolute;left:0;right:0;bottom:0;height:16px;z-index:39;display:grid;place-items:center;pointer-events:none}
.gbar i{display:block;width:108px;height:4px;border-radius:2px;background:var(--ink);opacity:.75}
.gbar.inv i{background:#fff}

/* ------------------------------ лист ------------------------------ */
.view{position:absolute;top:30px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:10px 18px 104px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.notabs{padding-bottom:40px}
.hd{display:flex;align-items:center;gap:9px;padding-bottom:9px}
.brand{font-size:13px;font-weight:800;letter-spacing:.24em;color:var(--red)}
.hd .sp{flex:1}
.bt{display:block;opacity:.22}
.bt.on{opacity:1}
.state{font-size:11px;font-weight:700;letter-spacing:.14em;background:none;border:0;padding:0}
button.state{cursor:pointer;color:var(--red-deep);text-decoration:underline;text-underline-offset:3px}
.rule{height:4px;background:var(--ink);border-radius:2px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:18px 0 5px;color:var(--red-deep)}
.ch{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:.96;text-transform:uppercase;text-wrap:balance}
.cp{font-size:13px;line-height:1.45;max-width:32ch;margin-top:9px;text-wrap:pretty}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.huge{font-size:104px;font-weight:800;letter-spacing:-.055em;line-height:.86;font-variant-numeric:tabular-nums;margin-top:2px}
.huge.word{font-size:60px;letter-spacing:-.03em;line-height:1.02}
/* кириллица: другой шрифт (Onest), ему нужно больше воздуха — иначе «Ё» налезает на строку выше */
.ru .ch{letter-spacing:-.02em;line-height:1.04}
.ru .huge.word{font-size:46px;letter-spacing:-.01em;line-height:1.1}
.card{background:var(--card);border-radius:18px;padding:0 14px}

.band{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:0 14px;margin:14px 0 12px;
  background:var(--ink);color:#fff;border-radius:var(--r);width:100%;border:0;text-align:left;cursor:pointer}
.band.red{background:var(--red)}
.band b{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band i{font-style:normal;font-size:20px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.warn{display:flex;align-items:center;gap:10px;background:var(--red-tint);border-radius:var(--r);padding:10px 12px;margin-top:12px}
.warn b{flex:1;font-size:12px;font-weight:800;color:var(--red-deep)}
.warn .btn{flex:none;min-height:38px;padding:6px 12px}

/* прогресс дня */
.prog{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.prog .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.prog .v{font-size:22px;font-weight:800;letter-spacing:-.03em}
.segs{display:flex;gap:5px;margin-top:6px}
.segs i{flex:1;height:12px;border-radius:var(--rx);background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
.segs i.t{background:var(--ink)}
.segs i.m{background:var(--red);box-shadow:none}
.segs i.a{box-shadow:inset 0 0 0 2px var(--red)}

/* строки приёмов */
.list{margin-top:10px}
.dose{display:grid;grid-template-columns:60px 1fr 84px;gap:8px;align-items:center;width:100%;padding:12px 0;cursor:pointer;
  background:none;border:0;border-top:2px solid var(--line);text-align:left}
.dose:first-child{border-top:0}
.dose .dt{font-size:22px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dose .dn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;min-width:0}
.dose .dn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cno{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:var(--rx);background:var(--ink);color:#fff;font-size:11px;font-weight:800}
.dose .dd{font-size:12px;color:var(--muted);margin-top:1px}
.stt{justify-self:end;text-align:right;font-size:10px;font-weight:800;letter-spacing:.1em;line-height:1.35;text-transform:uppercase}
.stt small{display:block;font-size:13px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stt.w{color:var(--muted)}
.stt.m{background:var(--red);color:#fff;padding:6px 9px;border-radius:var(--rs)}
.stt.x{background:var(--red-tint);color:var(--red-deep);padding:6px 9px;border-radius:var(--rs)}
.stt.a{box-shadow:inset 0 0 0 2px var(--red);color:var(--red-deep);padding:5px 8px;border-radius:var(--rs)}
.stt .late{display:block;color:var(--red-deep);font-size:10px;letter-spacing:.06em}
.dose:active,.cellrow:active,.dayrow:active{background:rgba(32,30,29,.06)}

/* ------------------------------ кнопки ------------------------------ */
.acts{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 10px;
  border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:11px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:var(--r)}
.btn:active{background:var(--ink);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:active{background:var(--red-press);border-color:var(--red-press)}
.btn.ink{background:var(--ink);color:#fff}
.btn.soft{border-color:transparent;background:var(--card)}
.btn:disabled{opacity:.3;cursor:default}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;min-height:1.3em;white-space:pre-wrap}
.note.err{color:var(--red-deep);font-weight:700}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--red-press)}
.hold span{position:relative}

/* нумерованные строки */
.row{border-top:2px solid var(--line);padding:13px 0 14px}
.row:first-child{border-top:0}
.rt{display:flex;align-items:baseline;gap:10px}
.rn{font-size:27px;font-weight:800;letter-spacing:-.04em;min-width:38px;font-variant-numeric:tabular-nums;color:var(--red)}
.rl{font-size:16px;font-weight:800;text-transform:uppercase}
.rd{font-size:12px;line-height:1.4;margin:4px 0 0 48px;max-width:30ch}

/* ячейки */
.cellrow{display:grid;grid-template-columns:40px 34px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;
  border-top:2px solid var(--line);padding:14px 0;cursor:pointer}
.cellrow:first-child{border-top:0}
.cellrow .nm{font-size:16px;font-weight:800;text-transform:uppercase;line-height:1.15}
.cellrow .dsc{font-size:12px;margin-top:3px}
.cellrow .tms{font-size:13px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.cellrow.empty .nm{color:var(--muted)}

/* редактор */
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:10px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;margin:22px 0 8px;color:var(--red-deep)}
.lab em{font-style:normal;letter-spacing:.08em;color:var(--muted);text-align:right}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.forms button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 9px;border:2px solid var(--ink);border-radius:var(--r);
  background:var(--card);cursor:pointer;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.forms button.on{background:var(--ink);color:#fff}
.inp{display:block;width:100%;border:2px solid var(--ink);border-radius:var(--r);padding:10px 12px;background:var(--card);outline:none}
.inp:focus{border-color:var(--red)}
.inp.big{font-size:22px;font-weight:800;letter-spacing:-.02em}
textarea.inp{font-size:13px;line-height:1.45;resize:none;min-height:60px}
.step{display:flex;align-items:center}
.step button{width:50px;height:50px;border:2px solid var(--ink);border-radius:var(--r);background:var(--card);font-size:22px;font-weight:800;cursor:pointer}
.step button:active{background:var(--ink);color:#fff}
.step .amtbtn{min-width:78px;height:50px;padding:0 6px;border:0;background:none;cursor:pointer;text-align:center;font-size:30px;font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;text-decoration:underline dotted 2px;text-decoration-color:var(--red);text-underline-offset:7px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.picker .wheel.narrow{width:56px}
.step .unit{margin-left:10px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chips.c3{grid-template-columns:repeat(3,1fr)}
.chips.c7{grid-template-columns:repeat(7,1fr);gap:4px}
.chips button{min-height:42px;border:2px solid var(--ink);border-radius:var(--rs);background:var(--card);cursor:pointer;font-size:10px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;line-height:1.2}
.chips button.on{background:var(--ink);color:#fff}
.chips button.wide{grid-column:1/-1}
.chips button.today{box-shadow:0 0 0 2px var(--red)}
.tog{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;cursor:pointer;text-align:left}
.tog b{display:block;font-size:13px;font-weight:800}
.tog small{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.tog>span:first-child{flex:1}
.sw{flex:none;width:48px;height:28px;border-radius:14px;background:#d9ccc7;position:relative;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--red)}
.sw.on i{left:23px}
.times{margin-top:2px}
.tr{display:flex;align-items:center;gap:8px;border-top:2px solid var(--line);padding:6px 0}
.tr:first-child{border-top:0}
.tr .tb{flex:1;display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;text-align:left}
.tr .tb b{font-size:30px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tr .tb span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tr .del{border:0;background:var(--sheet);border-radius:var(--rs);font-size:10px;font-weight:800;letter-spacing:.12em;cursor:pointer;padding:9px 11px;text-transform:uppercase;color:var(--red-deep)}
.addt{margin-top:8px}

/* колёса выбора времени, как на iPhone */
.picker .wheels{position:relative;display:flex;justify-content:center;align-items:center;gap:4px;height:220px;margin-top:6px;user-select:none;-webkit-user-select:none}
.picker .wbar{position:absolute;left:12%;right:12%;top:50%;height:48px;margin-top:-24px;background:var(--sheet);border-radius:var(--r)}
.picker .wheel{position:relative;z-index:1;width:92px;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent);mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent);cursor:grab}
.picker .wheel::-webkit-scrollbar{display:none}
.picker .wheel div{height:48px;line-height:48px;text-align:center;font-size:30px;font-weight:700;scroll-snap-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.picker .wheel div.sel{color:var(--ink);font-weight:800;font-size:34px}
.picker .wheel .pad{height:86px;scroll-snap-align:none}
.picker .colon{position:relative;z-index:1;font-size:32px;font-weight:800;padding-bottom:4px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.presets button{border:0;background:var(--sheet);border-radius:var(--rs);padding:8px 2px;cursor:pointer;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.presets button small{display:block;font-size:13px;letter-spacing:0;margin-top:2px;font-variant-numeric:tabular-nums}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* превью экрана таблетницы 172x320 */
.devwrap{display:flex;gap:14px;align-items:flex-start;margin-top:4px}
.devframe{flex:none;width:153px;height:274px;background:#141312;border-radius:18px;padding:8px}
.devs{width:172px;height:320px;transform:scale(.8);transform-origin:0 0;background:#fff;border-radius:14px;overflow:hidden;position:relative;font-family:"Archivo","Onest",Arial,sans-serif;color:var(--ink)}
.devs .n{position:absolute;left:16px;top:10px;width:40px;height:40px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}
.devs .c{position:absolute;left:66px;top:12px;font-size:14px;font-weight:800;letter-spacing:.07em}
.devs .f{position:absolute;left:66px;top:30px;font-size:14px;color:#55504d}
.devs .ln{position:absolute;left:0;right:0;height:2px;background:#a6a5a4}
.devs .ic{position:absolute;left:16px;top:68px}
.devs .nm{position:absolute;left:16px;right:16px;top:108px;font-size:20px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devs .body{position:absolute;left:16px;right:16px;top:134px;font-size:14px;line-height:18px}
.devs .body b{display:block;color:var(--red-deep);font-size:16px;font-weight:600;line-height:20px}
.devs .body span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.devs .tm{position:absolute;left:16px;right:8px;top:231px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}
.devs .bk{position:absolute;left:12px;right:12px;top:264px;height:44px;border:2px solid var(--ink);display:flex;align-items:center;gap:10px;padding-left:14px;font-size:16px;font-weight:800}
.devnote{font-size:12px;line-height:1.45}

/* история */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.stats div{background:var(--card);border-radius:var(--r);padding:10px 12px}
.stats b{display:block;font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.stats .m b{color:var(--red)}
.dayrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:2px solid var(--line);padding:13px 0;cursor:pointer;text-align:left}
.dayrow:first-child{border-top:0}
.dayrow .dn{flex:1;min-width:0}
.dayrow .dn b{display:block;font-size:15px;font-weight:800}
.dayrow .dn small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.pill{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:var(--rs);white-space:nowrap}
.pill.ok{background:var(--sheet)}
.pill.m{background:var(--red);color:#fff}
.pill.l{background:var(--red-tint);color:var(--red-deep)}
.dayrow .ar{font-size:18px;font-weight:800;color:var(--muted);width:14px;text-align:center}
.daydet{padding:0 0 10px 0}
.dline{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.dline .t{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.dline .n{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;min-width:0}
.dline .n span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dline .s{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.dline .s.m{color:var(--red)}
.dline .s.l{color:var(--red-deep)}
.dline .s.w{color:var(--muted)}
.medrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;border-top:2px solid var(--line);padding:12px 0}
.medrow:first-child{border-top:0}
.medrow b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medrow small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.medrow .v{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right}
.medrow .v small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.medrow .v small.m{color:var(--red)}

/* настройки */
.set{border-top:2px solid var(--line);padding:13px 0}
.set:first-child{border-top:0}
.set .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.set .v{font-size:18px;font-weight:800;margin-top:2px}
.set .d{font-size:12px;color:var(--muted);margin-top:3px;max-width:34ch}
.set .chips{margin-top:10px}
.set.flex{display:flex;align-items:center;gap:12px}

const FORMS = ['tablet', 'capsule', 'powder', 'drops'];
const formName = f => ({ tablet: L('Tablet', 'Таблетка'), capsule: L('Capsule', 'Капсула'), powder: L('Powder', 'Порошок'), drops: L('Drops', 'Капли') })[f];
function ruPl(n, a) { if (n % 1) return a[1]; const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a[0] : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? a[1] : a[2]; }

    case 'mixfood': return L('Mix with a spoon of food or juice.', 'Смешать с ложкой еды или сока.');
    case 'spoon': return L('Drip into a spoon of water.', 'Накапать в ложку воды.');
    case 'glass': return L(`Drip into ${en[w]}.`, `Накапать в ${acc[w]}.`);
    case 'eyes': return L('Drip into the eyes.', 'Закапать в глаза.');
    case 'nose': return L('Drip into the nose.', 'Закапать в нос.');

function instr(c) {
  const out = [];
  if (!NO_FOOD.includes(c.method)) {
    if (c.food === 'before') out.push(L(`${c.before} min before a meal.`, `За ${c.before} мин до еды.`));
    if (c.food === 'with') out.push(L('With a meal.', 'Во время еды.'));

function statusCell(d) {
  const s = stOf(d);
  if (s.s === 't') { const late = toMin(s.at) - toMin(d.t); return `<div class="stt">${L('Taken', 'Принято')}<small>${s.at}</small>${late > 30 ? `<span class="late">+${late} ${L('min', 'мин')}</span>` : ''}</div>`; }
  if (s.s === 'm') return `<div class="stt m">${L('Missed', 'Пропущено')}</div>`;
  if (s.s === 'a') return `<div class="stt a">${L('Ringing', 'Звонит')}</div>`;
  if (s.s === 's') return `<div class="stt">${L('Snoozed', 'Отложено')}<small>${s.until}</small></div>`;
  if (s.s === 'x') return `<div class="stt x">${L('No mark', 'Нет отметки')}</div>`;
  return `<div class="stt w">${L('Later', 'Позже')}</div>`;
}

function vToday() {
  const ds = todayDoses(), nx = nextDose(), taken = ds.filter(d => stOf(d).s === 't').length;
  let h = header();
  if (mode === 'demo' && PHONE) h += `<div class="warn"><b>${L('Demo: nothing is saved and no reminders come.', 'Демо: ничего не сохраняется и напоминаний не будет.')}</b><button class="btn" id="leaveDemo">${L('Connect', 'Связать')}</button></div>`;
  if (mode === 'live' && !linked) h += `<div class="warn"><b>${L('The pillbox is not connected. The phone reminds you while this page is open.', 'Таблетница не подключена. Напоминает телефон, пока страница открыта.')}</b><button class="btn" id="reconnect2">${L('Connect', 'Связать')}</button></div>`;
  if (FRAME && !notifOn) h += `<div class="warn"><b>${L('Phone notifications are blocked. Only the pillbox will ring.', 'Уведомления на телефоне запрещены. Звонить будет только таблетница.')}</b><button class="btn" id="fixN">${L('Allow', 'Разрешить')}</button></div>`;

    return h + `<div class="eyebrow">${L('Today', 'Сегодня')}</div><h2 class="ch">${L('Nothing<br>to take yet', 'Пока нечего<br>принимать')}</h2>

      <div class="acts"><button class="btn pri" data-tab="cells">${L('Fill cells', 'Заполнить ячейки')}</button></div>`;
  }
  if (!ds.length) return h + `<div class="eyebrow">${dayName(today())}</div><h2 class="ch">${L('No doses<br>today', 'Сегодня<br>приёмов нет')}</h2><p class="cp">${noDosesText()}</p>`;
  if (nx) {

    h += `<div class="eyebrow">${ring ? L('Take now', 'Примите сейчас') : snz ? L('Snoozed dose', 'Отложенный приём') : L('Next dose', 'Следующий приём')}</div>
      <div class="huge">${snz ? s.until : nx.t}</div>
      <button class="band${ring ? ' red' : ''}" id="nextBand"><b>${L('Cell', 'Ячейка')} ${nx.cell + 1} · ${esc(c.name)}</b><i>${ring ? L('NOW', 'СЕЙЧАС') : inText(toMin(snz ? s.until : nx.t) - nowMin())}</i></button>`;
  } else {
    h += `<div class="eyebrow">${L('Today', 'Сегодня')}</div><div class="huge word">${L('All done<br>for today', 'На сегодня<br>всё')}</div><div style="height:14px"></div>`;

    <div class="segs">${ds.map(d => { const s = stOf(d).s; return `<i class="${s === 't' ? 't' : s === 'm' ? 'm' : s === 'a' ? 'a' : ''}"></i>`; }).join('')}</div>
    <div class="eyebrow" style="margin-top:22px">${dayName(today())}</div>

/* ближайший день недели, когда назначен приём */
function nextDayName(days) {
  for (let k = 1; k <= 7; k++) { const d = new Date(today()); d.setDate(d.getDate() + k); if (days[dow(d)]) return k === 1 ? L('tomorrow', 'завтра') : L(WD()[dow(d)], WD()[dow(d)].toLowerCase()); }
  return '—';
}
function noDosesText() {
  for (let k = 1; k <= 7; k++) {
    const d = new Date(today()); d.setDate(d.getDate() + k);
    const x = scheduleFor(d)[0];
    if (x) return L(`Next: ${k === 1 ? 'tomorrow' : WD()[dow(d)]} at ${x.t}, cell ${x.cell + 1}.`, `Следующий приём: ${k === 1 ? 'завтра' : WD()[dow(d)].toLowerCase()} в ${x.t}, ячейка ${x.cell + 1}.`);
  }
  return L('Nothing is scheduled this week. Add times in Cells.', 'На этой неделе ничего не назначено. Добавьте время в «Ячейках».');
}

/* колёса выбора, как на iPhone: время (часы : минуты) или доза (например, граммы 0–500 и половинка) */
const ITEM = 48;
const range = n => Array.from({ length: n }, (_, k) => k);
const PRESETS = () => [['08:00', L('Morning', 'Утро')], ['13:00', L('Noon', 'День')], ['19:00', L('Evening', 'Вечер')], ['22:00', L('Night', 'Ночь')]];
const G_PRESETS = [2.5, 5, 10, 100];
function pickerCols() {
  if (picker.kind === 'time') return [{ id: 'wH', key: 'h', vals: range(24).map(k => String(k).padStart(2, '0')), label: L('Hours', 'Часы') }, ':',
                                      { id: 'wM', key: 'm', vals: range(60).map(k => String(k).padStart(2, '0')), label: L('Minutes', 'Минуты') }];
  const c = draft.c;
  if (isG(c)) return [{ id: 'wA', key: 'a', vals: range(501).map(String), label: L('Grams', 'Граммы') }, lang === 'ru' ? ',' : '.',
                      { id: 'wB', key: 'b', vals: ['0', '5'], label: L('Tenths', 'Десятые'), narrow: 1 }, L('g', 'г')];
  if (c.form === 'tablet') return [{ id: 'wA', key: 'a', vals: range(21).map(String), label: L('Tablets', 'Таблетки') },
                                   { id: 'wB', key: 'b', vals: ['', '½'], label: L('Half', 'Половинка'), narrow: 1 }];
  return [{ id: 'wA', key: 'a', vals: range(c.form === 'drops' ? 61 : 21).map(String), label: L('Amount', 'Количество') }];
}
function vPicker() {
  const time = picker.kind === 'time';
  const wheels = pickerCols().map(col => typeof col === 'string' ? `<div class="colon">${col}</div>`
    : `<div class="wheel${col.narrow ? ' narrow' : ''}" id="${col.id}" tabindex="0" aria-label="${col.label}"><div class="pad"></div>${col.vals.map(v => `<div>${v || '&nbsp;'}</div>`).join('')}<div class="pad"></div></div>`).join('');
  const presets = time ? PRESETS().map(p => `<button data-preset="${p[0]}">${p[1]}<small>${p[0]}</small></button>`).join('')
    : isG(draft.c) ? G_PRESETS.map(g => `<button data-gpreset="${g}">${L('Quick', 'Быстро')}<small>${fmtG(g)} ${L('g', 'г')}</small></button>`).join('') : '';
  const title = time ? (picker.idx < 0 ? L('Add time', 'Новое время') : L('Change time', 'Изменить время')) : L('Dose', 'Доза') + ' · ' + (isG(draft.c) ? L('grams', 'граммы') : formName(draft.c.form).toLowerCase());
  return `<div class="dim" id="pDim"></div><div class="sheet picker" role="dialog" aria-label="${title}">
    <div class="eyebrow">${title}</div>
    ${presets ? `<div class="presets">${presets}</div>` : ''}
    <div class="wheels" id="wheels"><div class="wbar"></div>${wheels}</div>
    <div class="note err" id="pErr">${picker.err || ''}</div>
    <div class="acts" style="margin-top:6px"><button class="btn" id="pCancel">${L('Cancel', 'Отмена')}</button><button class="btn pri" id="pOk">OK</button></div></div>`;
}
function setupWheels() {
  pickerCols().filter(c => typeof c !== 'string').forEach(({ id, key }) => {
    const el = document.getElementById(id); if (!el) return;
    el.scrollTop = picker[key] * ITEM;
    const mark = () => { const i = Math.round(el.scrollTop / ITEM); picker[key] = Math.max(0, Math.min(el.children.length - 3, i));
      [...el.children].forEach((d, k) => d.classList.toggle('sel', k - 1 === picker[key])); };
    mark();
    el.addEventListener('scroll', () => requestAnimationFrame(mark), { passive: true });
    let y0 = 0, s0 = 0, drag = false;                    // мышью на компьютере — тянуть
    el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; drag = true; y0 = e.clientY; s0 = el.scrollTop; el.style.scrollSnapType = 'none'; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => { if (drag) el.scrollTop = s0 - (e.clientY - y0); });
    const up = () => { if (!drag) return; drag = false; el.style.scrollSnapType = ''; el.scrollTo({ top: Math.round(el.scrollTop / ITEM) * ITEM, behavior: 'smooth' }); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); el.scrollTo({ top: (picker[key] + (e.key === 'ArrowDown' ? 1 : -1)) * ITEM, behavior: 'smooth' }); } });
  });
}
/* прокрутить колесо к значению: рядом — плавно, далеко — сразу */
function wheelTo(id, i) {
  const el = document.getElementById(id); if (!el) return;
  el.scrollTo({ top: i * ITEM, behavior: Math.abs(el.scrollTop - i * ITEM) > 12 * ITEM ? 'auto' : 'smooth' });
}
const maxAmt = c => isG(c) ? 500 : c.form === 'drops' ? 60 : 20;
function openAmountPicker() {
  const c = draft.c;
  picker = { kind: 'amount', a: Math.floor(c.amount), b: c.amount % 1 ? 1 : 0, err: '' };
}function openPicker(idx) {
  const c = draft.c;
  let t = idx >= 0 ? c.times[idx] : null;
  if (!t) {                                   // предлагаем свободное время: через 12 ч после последнего
    let m = c.times.length ? toMin(c.times[c.times.length - 1]) + 12 * 60 : 8 * 60;
    for (let k = 0; k < 24 && c.times.includes(hhmm(m)); k++) m += 60;
    t = hhmm(m);
  }
  picker = { kind: 'time', idx, h: +t.slice(0, 2), m: +t.slice(3), err: '' };
}

/* история: из журнала по дням */
function hist() {
  const days = [];
  for (let k = 0; k < 7; k++) {
    const d = new Date(today()); d.setDate(d.getDate() - k);
    const e = log[dkey(d)];
    if (e && e.length) days.push({ d, e, today: k === 0 });
  }
  return days;
}
const lateMin = x => x.s === 't' && x.at ? toMin(x.at) - toMin(x.t) : 0;
function vHistory() {
  const days = hist(), all = days.flatMap(x => x.e);
  const onTime = all.filter(x => x.s === 't' && lateMin(x) <= 30).length, late = all.filter(x => x.s === 't' && lateMin(x) > 30).length, miss = all.filter(x => x.s === 'm').length;

    <p class="cp" style="margin-top:6px;font-weight:700">${L(`of doses taken on time. ${onTime} of ${done}.`, `приёмов — вовремя. ${onTime} из ${done}.`)}</p>

    <div class="eyebrow" style="margin-top:22px">${L('By day', 'По дням')}</div><div class="card">`;
  days.forEach(x => {

let splashT0 = 0, splashRaf = 0;

/* Как на таблетнице: четыре квадрата-ячейки заливаются по кругу, под ними логотип. */
const SPLASH_S = 3.4;
function startSplash() { splashOn = true; splashT0 = performance.now(); render(); tickSplash(); clearTimeout(startSplash.tm); startSplash.tm = setTimeout(endSplash, (SPLASH_S + 0.6) * 1000); }
function endSplash() { if (!splashOn) return; splashOn = false; cancelAnimationFrame(splashRaf); render(); }
function tickSplash() {
  if (!splashOn) return;
  const t = (performance.now() - splashT0) / 1000, sp = document.getElementById('splash');
  if (sp) {
    const ORDER = [0, 1, 3, 2];
    sp.querySelectorAll('.sq b').forEach((b, i) => {
      const p = (((t - ORDER[i] * 0.3 + 2.4) % 2.4) + 2.4) % 2.4 / 2.4;
      b.style.opacity = p < 0.10 ? 0 : p < 0.25 ? (p - 0.10) / 0.15 : p < 0.85 ? 1 : (1 - p) / 0.15;
    });
    if (t > SPLASH_S) sp.style.opacity = '0';
  }
  if (t < SPLASH_S + 0.5) splashRaf = requestAnimationFrame(tickSplash); else endSplash();
}

      <button class="btn" data-sim="noAnswer" ${ring ? '' : 'disabled'}>${L('No answer · 3 rings', 'Никто не ответил · 3 звонка')}</button>
      <button class="btn" data-sim="range">${linked ? L('Pillbox out of range', 'Таблетница вне связи') : L('Pillbox back in range', 'Таблетница снова на связи')}</button>
      <button class="btn" data-sim="first">${L('First run', 'Первый запуск')}</button>
      <button class="btn" data-sim="splash">${L('Replay splash', 'Показать заставку')}</button>
      <button class="btn" data-sim="reset">${L('Reset demo', 'Сбросить демо')}</button>
      <p class="cp" style="font-size:12px">${L('Tap the phone’s status bar to pull down the notification shade.', 'Нажмите на строку состояния телефона, чтобы открыть шторку уведомлений.')}</p></div>
    <div class="sec"><div class="lab" style="margin-top:0">${L('App icon and name', 'Значок и имя')}</div>
      <div class="iconrow"><span class="appicon"><i>Lolid</i>Lolid Pillbox</span><span class="appicon sq"><i>Lolid</i>Lolid Pillbox</span></div>
      <p class="cp" style="font-size:12px">${L('The app is called Lolid Pillbox, under the icon too.', 'Приложение называется Lolid Pillbox — так же и под значком.')}</p></div>`;
}

/* ------------------------------ события ------------------------------ */
function hold(el, done) {
  let t0 = 0, raf = 0;
  const fill = el.querySelector('.fill'), HOLD = 1500;
  const stop = () => { cancelAnimationFrame(raf); t0 = 0; fill.style.width = '0'; };
  const step = () => { const p = Math.min(1, (performance.now() - t0) / HOLD); fill.style.width = (p * 100) + '%'; if (p >= 1) { stop(); done(); } else raf = requestAnimationFrame(step); };
  const start = e => { if (t0) return; e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); };
  el.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
  el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') start(e); });
  el.addEventListener('keyup', stop);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function openEditor(i) {
  const c = cells[i];
  draft = { i, isNew: !c, c: c ? JSON.parse(JSON.stringify(c)) : blankCell() };
  draft.orig = JSON.stringify(draft.c);
  draft.someDays = !draft.c.days.every(Boolean);
}
function fixMethod(c) {
  if (!METHODS[c.form].includes(c.method)) c.method = METHODS[c.form][0];
  const w = WATER_OPT(c.method);
  if (w.length && !w.includes(c.water)) c.water = w.includes('full') ? 'full' : w[0];
  if (c.form !== 'powder') c.grams = false;
  if (c.form !== 'tablet' && !isG(c) && c.amount % 1) c.amount = Math.ceil(c.amount);
  c.amount = Math.max(c.form === 'tablet' ? 0.5 : 1, Math.min(maxAmt(c), c.amount));
}

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-nid],#sbar,#dim,#pDim');
  if (!b) return;
  const d = b.dataset, id = b.id;
  if (d.plang) { lang = d.plang; render(); return; }
  if (d.sim) { sim[d.sim](); render(); return; }
  if (!$('#screen').contains(b)) return;

  if (d.na) {                                   // кнопка в уведомлении (демо)
    const n = notifs.find(x => x.id === d.nid) || huNotif; if (!n) return;
    if (d.na === 'taken') markTaken(n.key, hhmm(nowMin()));
    else if (d.na === 'snooze') snoozeNow(n.key);
    else { shade = false; huNotif = null; tab = 'today'; draft = null; closeAlarm(); sheetKey = n.key; render(); }
    return;
  }
  if (id === 'sbar') { shade = !shade; huNotif = null; render(); return; }
  if (d.nid) {
    const n = notifs.find(x => x.id === d.nid) || huNotif;
    shade = false; huNotif = null;
    if (n && (n.kind === 'dose' || n.kind === 'offline')) openAlarm(n.key);
    else if (n && n.kind === 'missed') { tab = 'today'; draft = null; sheetKey = n.key; }
    render(); return;
  }
  // --- выбор времени ---
  if (picker) {
    if (d.preset) {
      wheelTo('wH', +d.preset.slice(0, 2)); wheelTo('wM', +d.preset.slice(3));
      return;
    }
    if (d.gpreset) {
      const g = +d.gpreset;
      wheelTo('wA', Math.floor(g)); wheelTo('wB', g % 1 ? 1 : 0);
      return;
    }
    if (id === 'pOk' && picker.kind === 'amount') {
      const c = draft.c, v = picker.a + (picker.b ? 0.5 : 0);
      if (v <= 0) {
        picker.err = L('Choose more than zero.', 'Выберите больше нуля.');
        $('#pErr').textContent = picker.err; const w = $('#wheels'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
        return;
      }
      c.amount = v; picker = null; render(); return;
    }
    if (id === 'pOk') {
      const t = hhmm(picker.h * 60 + picker.m), c = draft.c, dup = c.times.findIndex(x => x === t);
      if (dup >= 0 && dup !== picker.idx) {
        picker.err = L(`${t} is already in the list.`, `${t} уже есть в списке.`);
        const e2 = $('#pErr'); e2.textContent = picker.err; const w = $('#wheels'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
        return;
      }
      if (picker.idx >= 0) c.times[picker.idx] = t; else c.times.push(t);
      c.times.sort(); picker = null; render(); return;
    }
    if (id === 'pCancel' || id === 'pDim') { picker = null; render(); return; }
    return;
  }
  if (id === 'closeShade') shade = false;
  else if (id === 'connect') {
    if (FRAME) scanStep = 1;
    else { if (mode !== 'live') loadLive(); bleConnect(true); return; }
  }
  else if (id === 'tryDemo') { resetDemo(); toast(L('Demo. Nothing is connected.', 'Демо. Ничего не подключено.')); }
  else if (id === 'leaveDemo') { loadLive(); onboarded = paired; if (NATIVE) nativeMerge(); }
  else if (id === 'reconnect' || id === 'reconnect2' || id === 'reconnect3') { bleConnect(false); return; }
  else if (id === 'pick') { scanStep = 2; render(); setTimeout(() => { linked = true; paired = true; scanStep = 0; notifs = [{ id: 'svc', kind: 'service' }]; dlg = 'notif'; render(); }, 1100); return; }
  else if (id === 'allow' || id === 'deny') { notifOn = id === 'allow'; dlg = null; onboarded = true; tab = 'today'; toast(notifOn ? L('Linked. Schedule sent to the pillbox.', 'Связь есть. Расписание отправлено на таблетницу.') : L('Linked. Phone notifications are blocked.', 'Связь есть. Уведомления на телефоне запрещены.')); }
  else if (id === 'fixN' || id === 'askPerm') {
    if (NATIVE) { AndroidPillbox.askNotif(); return; }
    if (FRAME) dlg = 'notif';
    else if (typeof Notification !== 'undefined') { Notification.requestPermission().then(render); return; }
  }
  else if (d.tab) { tab = d.tab; sheetKey = null; }
  else if (d.dayOpen) openDay = openDay === d.dayOpen ? null : d.dayOpen;
  else if (d.key) sheetKey = d.key;
  else if (id === 'nextBand') { const nx = nextDose(); if (nx && stOf(nx).s === 'a') openAlarm(nx.k); else if (nx) sheetKey = nx.k; }
  else if (id === 'dim' || id === 'closeSheet') sheetKey = null;
  else if (id === 'openAlarm') { const k = sheetKey; sheetKey = null; openAlarm(k); }
  else if (id === 'openCell') { const i = +sheetKey.split('|')[0]; sheetKey = null; openEditor(i); }
  else if (d.cell) openEditor(+d.cell);
  else if (id === 'aTaken') { markTaken(alarmKey, hhmm(nowMin())); return; }
  else if (id === 'aSnooze') { snoozeNow(alarmKey); return; }
  else if (d.form) { draft.c.form = d.form; fixMethod(draft.c); }
  else if (d.amt) { const c = draft.c, stp = c.form === 'tablet' || isG(c) ? 0.5 : 1; c.amount = Math.max(stp, Math.min(maxAmt(c), c.amount + stp * +d.amt)); }
  else if (d.gunit) { draft.c.grams = d.gunit === '1'; draft.c.amount = draft.c.grams ? 2.5 : 1; }
  else if (d.method) { draft.c.method = d.method; fixMethod(draft.c); }
  else if (d.water) draft.c.water = d.water;
  else if (d.food) draft.c.food = d.food;
  else if (d.before) draft.c.before = +d.before;
  else if (d.flag) draft.c.flags[d.flag] = draft.c.flags[d.flag] ? 0 : 1;
  else if (d.deltime) draft.c.times.splice(+d.deltime, 1);
  else if (d.edittime) openPicker(+d.edittime);
  else if (id === 'addTime') openPicker(-1);
  else if (id === 'amtBtn') openAmountPicker();
  else if (d.daymode) {
    draft.someDays = d.daymode === 'some';
    draft.c.days = draft.someDays ? [0, 0, 0, 0, 0, 0, 0].map((x, k) => k === dow(today()) ? 1 : 0) : [1, 1, 1, 1, 1, 1, 1];
  }
  else if (d.day) { draft.c.days[+d.day] = draft.c.days[+d.day] ? 0 : 1; if (!draft.c.days.some(Boolean)) draft.c.days[+d.day] = 1; }
  else if (id === 'save') {
    const i = draft.i, c = draft.c;
    cells[i] = c;
    Object.keys(st).forEach(k => { if (+k.split('|')[0] === i && !c.times.includes(k.split('|')[1])) delete st[k]; });
    draft = null; tab = 'cells';
    bleSend(cellLine(c, i));
    toast(linked ? L(`Cell ${i + 1} sent to the pillbox.`, `Ячейка ${i + 1} отправлена на таблетницу.`) : L(`Cell ${i + 1} saved. It goes to the pillbox when connected.`, `Ячейка ${i + 1} сохранена. Уйдёт на таблетницу, когда будет связь.`));
    changed(true); return;
  }
  else if (id === 'cancel') draft = null;
  else if (id === 'clearCell') {
    const i = draft.i; cells[i] = null; Object.keys(st).forEach(k => { if (+k.split('|')[0] === i) delete st[k]; });
    draft = null; bleSend(`CLEAR|${i + 1}`); toast(L(`Cell ${i + 1} emptied.`, `Ячейка ${i + 1} очищена.`)); changed(true); return;
  }
  else if (id === 'fillExamples') { cells = demoCells(); syncAll(); changed(false); return; }
  else if (d.set) {
    const v = +d.v;
    if (d.set === 'lang') { lang = v ? 'ru' : 'en'; syncAll(); }
    if (d.set === 'bright') { cfg.bright = v; bleSend(`CFG|bright|${v}`); }
    save();
  }
  else if (d.tog) {
    cfg[d.tog] = !cfg[d.tog];
    if (d.tog === 'night') bleSend(`CFG|night|${cfg.night ? '22-7' : 'off'}`);
    if (d.tog === 'sound') bleSend(`CFG|sound|${cfg.sound ? 1 : 0}`);
    if (d.tog === 'phone' && cfg.phone && mode === 'live' && typeof Notification !== 'undefined' && Notification.permission === 'default') Notification.requestPermission().then(render);
    save();
  }
  else if (id === 'testNotify') { AndroidPillbox.testNotify(); toast(L('Sent. If nothing appeared, tap “Fix” next to what is off.', 'Отправлено. Если ничего не пришло — нажмите «Исправить» напротив того, что выключено.')); }
  else if (d.fix) { if (d.fix === 'notif') AndroidPillbox.askNotif(); else AndroidPillbox.openSetting(d.fix); return; }
  else if (id === 'testRing') { bleSend('TEST'); toast(L('The pillbox rings once. Nothing is marked.', 'Таблетница звонит один раз. Ничего не отмечается.')); }
  else if (id === 'forget') {
    if (NATIVE && mode === 'live') { AndroidPillbox.forget(); linked = false; paired = false; onboarded = false; save(); }
    else if (mode === 'live') { try { bleDev && bleDev.gatt.connected && bleDev.gatt.disconnect(); } catch (e2) { } bleDev = null; rxCh = null; linked = false; paired = false; onboarded = false; save(); }
    else sim.first();
  }
  else return;
  render();
});

document.addEventListener('input', e => {
  if (!draft) return;
  if (e.target.id === 'fName') {
    draft.c.name = e.target.value;
    const s = $('#save'); if (s) s.disabled = !(draft.c.name.trim() && draft.c.times.length);
    const nm = document.querySelector('.devs .nm'); if (nm) nm.textContent = draft.c.name || L('Name', 'Название');
    const t = $('#edTitle'); if (t) t.textContent = draft.c.name || L('New medicine', 'Новое лекарство');
    const n = $('#edNote'); if (n) n.textContent = !draft.c.name.trim() ? L('Type a name to save.', 'Введите название, чтобы сохранить.') : '';
  }
  if (e.target.id === 'fNote') {
    if (lang === 'ru') draft.c.noteRu = e.target.value; else { draft.c.note = e.target.value; delete draft.c.noteRu; }
    const b = document.querySelector('.devs .body span'); if (b) b.textContent = instr(draft.c);
  }
});

/* телефон целиком на узком окне компьютера */
function fit() {
  if (PHONE) return;
  const w = Math.min(380, document.documentElement.clientWidth - 32), k = w / 380;
  $('#phone').style.transform = k < 1 ? `scale(${k})` : '';
  $('#holder').style.width = w + 'px';
  $('#holder').style.height = (800 * k) + 'px';
}
addEventListener('resize', fit);

/* старт: на компьютере — демо; на телефоне — настоящий режим (или первый запуск) */
/* ---------------- мост Android: эти функции вызывает приложение ---------------- */
const NOTES = {
  BT_OFF: ['Turn Bluetooth on, then tap connect.', 'Включите Bluetooth и нажмите «Связать».'],
  NOT_FOUND: ['No pillbox found. Plug it in, keep it close and try again.', 'Таблетница не найдена. Включите её, поднесите ближе и попробуйте снова.'],
  SCAN_FAIL: ['Bluetooth search failed. Try again.', 'Поиск Bluetooth не удался. Попробуйте снова.'],
  NO_SERVICE: ['This device is not a Lolid pillbox.', 'Это устройство — не таблетница Lolid.'],
  PERM: ['Bluetooth permission refused. Allow it in Android settings to connect.', 'Нет разрешения на Bluetooth. Разрешите его в настройках Android.']
};
window.nativeState = (s, name) => {
  const was = linked;
  linked = s === 'LINKED';
  scanStep = s === 'SCANNING' ? 1 : s === 'LINKING' ? 2 : 0;
  if (name) devName = name;
  if (linked) {
    errNote = '';
    if (!paired || !onboarded) { paired = true; onboarded = true; tab = cells.some(Boolean) ? 'today' : 'cells'; }
    if (!was) { syncAll(); toast(L('Linked. Schedule sent to the pillbox.', 'Связь есть. Расписание отправлено на таблетницу.')); }
  }
  save(); render();
};
window.nativeNote = code => { const n = NOTES[code]; errNote = n ? L(n[0], n[1]) : code; if (onboarded) toast(errNote); render(); };
window.nativeEvent = line => { if (mode === 'live') onEvent(line); };
window.nativeOpenAlarm = key => {
  if (mode !== 'live' || !cells[+key.split('|')[0]]) return;
  if (!st[key] || st[key].s !== 'a') st[key] = { s: 'a', since: nowMin() };
  openAlarm(key); render();
};
window.nativeOpenSheet = key => { if (mode !== 'live') return; draft = null; picker = null; tab = 'today'; sheetKey = key; render(); };
/* «Назад»: системная кнопка/жест Android и свайп вправо на любом телефоне. Возвращает false, если закрывать нечего. */
function goBack() {
  if (splashOn) endSplash();
  else if (view === 'alarm') return true;           // тревогу смахнуть нельзя — только «Принял» или «Отложить»
  else if (picker) picker = null;
  else if (sheetKey) sheetKey = null;
  else if (draft) {
    if (JSON.stringify(draft.c) !== draft.orig) toast(L('Changes not saved.', 'Изменения не сохранены.'));
    draft = null;
  }
  else if (onboarded && tab !== 'today') tab = 'today';
  else return false;
  render(); return true;
}
window.nativeBack = goBack;

/* свайп вправо (палец ведёт слева направо) = назад, как на iPhone и Android */
(function swipeBack() {
  const scr = document.getElementById('screen');
  let x0 = 0, y0 = 0, t0 = 0, on = false;
  scr.addEventListener('touchstart', e => {
    const t = e.touches[0], el = e.target;
    on = e.touches.length === 1 && !el.closest('.wheel,input,textarea,.hold');
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, { passive: true });
  scr.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (dx > 70 && Math.abs(dy) < Math.max(40, dx * 0.5) && Date.now() - t0 < 800) goBack();
  }, { passive: true });
  scr.addEventListener('touchcancel', () => { on = false; }, { passive: true });
})();
window.nativeResume = () => { if (NATIVE && mode === 'live') { nativeMerge(); if (!draft && !picker) render(); } };
let lastBar = '';
function setBar(c) { if (NATIVE && c !== lastBar) { lastBar = c; try { AndroidPillbox.bar(c); } catch (e) { } } }

if (PHONE) { loadLive(); if (NATIVE) nativeMerge(); } else resetDemo();
fit();
startSplash();
</script>
